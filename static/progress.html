<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Neon Escape — Progress</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      background-color: black;
      color: turquoise;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      text-decoration: underline;
      color: turquoise;
      margin-bottom: 30px;
    }

    section {
      border: 2px solid purple;
      padding: 20px;
      margin: auto;
      max-width: 700px;
      background-color: black;
      margin-bottom: 20px;
    }

    h2 {
      text-align: center;
      font-size: 20px;
      margin-top: 0;
      color: turquoise;
    }

    .stat {
      font-size: 18px;
      line-height: 1.8;
    }

    .big {
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
    }

    .puzzle-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .puzzle-item {
      padding: 10px 14px;
      border: 1px dashed gray;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .puzzle-item.solved {
      border-color: turquoise;
      color: turquoise;
    }

    .puzzle-item.unsolved {
      color: gray;
      border-color: #333;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.solved { background-color: turquoise; }
    .dot.unsolved { background-color: #333; }

    .completed-banner {
      text-align: center;
      font-size: 24px;
      color: #00ff00;
      border: 2px solid #00ff00;
      padding: 16px;
      margin: auto;
      max-width: 700px;
      margin-bottom: 20px;
      display: none;
    }

    .timer {
      font-size: 42px;
      font-weight: bold;
      text-align: center;
      color: turquoise;
      margin: 10px 0;
    }

    .timer.warning { color: orange; }
    .timer.danger { color: red; }

    .status-bar {
      text-align: center;
      font-size: 13px;
      color: gray;
      margin-top: 20px;
    }

    #no-session {
      text-align: center;
      font-size: 20px;
      color: gray;
      margin-top: 40px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>NEON ESCAPE — ADMIN PROGRESS</h1>

  <div class="completed-banner" id="completed-banner">
    ✓ IGRA ZAVRŠENA!
  </div>

  <!-- Odabir lobbyja ako nije zadan u URL-u -->
  <section id="lobby-select-section" style="display:none">
    <h2>Odaberi lobby</h2>
    <div id="lobby-list" style="margin-top:10px;"></div>
    <div style="margin-top:16px; font-size:14px; color:gray;">ili unesi ručno:</div>
    <input type="text" id="lobby-input" placeholder="ime lobbyja"
      style="width:100%;padding:8px;background:#111;border:1px solid turquoise;color:turquoise;font-family:inherit;font-size:15px;margin-top:8px;">
    <button onclick="selectLobby(document.getElementById('lobby-input').value.trim())"
      style="width:100%;padding:10px;margin-top:10px;background:transparent;border:2px solid turquoise;color:turquoise;font-family:inherit;font-size:15px;cursor:pointer;">
      Prikaži
    </button>
  </section>

  <p id="no-session" style="display:none;">Nema aktivne sesije.</p>

  <section id="main-section" style="display:none">
    <h2>Zagonetke — <span id="lobby-label" style="color:purple"></span>
      <button id="delete-lobby-btn" onclick="deleteLobby()"
        style="float:right;padding:4px 12px;background:transparent;border:1px solid red;color:red;font-family:inherit;font-size:13px;cursor:pointer;">
        Obriši lobby
      </button>
    </h2>
    <div class="big" id="counter">0/10</div>
    <div class="puzzle-grid" id="puzzle-grid"></div>
  </section>

  <section id="players-section" style="display:none">
    <h2>Igrači</h2>
    <div id="players-list"></div>
  </section>

  <section id="timer-section" style="display:none">
    <h2>Preostalo vrijeme</h2>
    <div class="timer" id="timer">--:--</div>
  </section>

  <div class="status-bar" id="status-bar">Učitavanje...</div>

  <script>
    const PUZZLES = [
      { id: 'walkmanMarker',  label: 'Zag. 1A — Walkman' },
      { id: 'awakenedPC',     label: 'Zag. 1B — PC' },
      { id: 'pagerMarker',    label: 'Zag. 2A — Pager' },
      { id: 'antennaMarker',  label: 'Zag. 2B — Antena' },
      { id: 'numbersMarker',  label: 'Zag. 3 — Brojevi' },
      { id: 'neonApollo',     label: 'Zag. 4 — Neon Apollo' },
      { id: 'wallClock',      label: 'Zag. 5 — Sat' },
      { id: 'memoryMarker',   label: 'Zag. 6 — Memory' },
      { id: 'rebusMarker',    label: 'Zag. 7 — Rebus' },
      { id: 'romanMarker',    label: 'Zag. 8 — Julius Caesar' },
    ];

    const params = new URLSearchParams(window.location.search);
    let currentLobby = params.get('lobby') ? params.get('lobby').toLowerCase() : null;

    function formatTime(seconds) {
      if (seconds <= 0) return '00:00';
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function selectLobby(name) {
      if (!name) return;
      currentLobby = name;
      document.getElementById('lobby-select-section').style.display = 'none';
      document.getElementById('lobby-label').textContent = name;
      startRefresh();
    }

    async function loadLobbyList() {
      try {
        const res = await fetch('/lobbies');
        const list = await res.json();
        const container = document.getElementById('lobby-list');
        container.innerHTML = '';
        if (list.length === 0) {
          container.textContent = 'Nema aktivnih lobbyja.';
          return;
        }
        list.forEach(l => {
          const btn = document.createElement('button');
          btn.textContent = `${l.lobby_name} (voditelj: ${l.host}, igrača: ${l.player_count})`;
          btn.style.cssText = 'width:100%;padding:10px;margin-top:8px;background:transparent;border:1px dashed purple;color:turquoise;font-family:inherit;font-size:14px;cursor:pointer;text-align:left;';
          btn.onclick = () => selectLobby(l.lobby_name);
          container.appendChild(btn);
        });
      } catch (e) {
        document.getElementById('lobby-list').textContent = 'Greška pri dohvatu lobbyja.';
      }
    }

    async function refresh() {
      if (!currentLobby) return;
      try {
        const res = await fetch('/lobby/' + currentLobby + '/progress');
        if (!res.ok) {
          document.getElementById('status-bar').textContent = 'Lobby ne postoji — ' + new Date().toLocaleTimeString();
          return;
        }
        const data = await res.json();

        if (!data.is_started && data.count === 0) {
          document.getElementById('no-session').style.display = 'block';
          document.getElementById('main-section').style.display = 'none';
          document.getElementById('timer-section').style.display = 'none';
          document.getElementById('players-section').style.display = 'none';
          document.getElementById('status-bar').textContent = 'Čeka početak igre — ' + new Date().toLocaleTimeString();
          return;
        }

        document.getElementById('no-session').style.display = 'none';
        document.getElementById('main-section').style.display = 'block';
        document.getElementById('timer-section').style.display = 'block';
        document.getElementById('players-section').style.display = 'block';

        document.getElementById('counter').textContent = `${data.count}/${data.total}`;

        // Zagonetke s imenima igrača
        const grid = document.getElementById('puzzle-grid');
        grid.innerHTML = '';
        PUZZLES.forEach(p => {
          const solver = data.solved_by[p.id];
          const solved = !!solver;
          const div = document.createElement('div');
          div.className = 'puzzle-item ' + (solved ? 'solved' : 'unsolved');
          div.innerHTML = `<div class="dot ${solved ? 'solved' : 'unsolved'}"></div>${p.label}${solved ? ' <span style="color:#aaa;font-size:13px">— ' + solver + '</span>' : ''}`;
          grid.appendChild(div);
        });

        // Popis igrača
        const playersList = document.getElementById('players-list');
        playersList.innerHTML = '';
        (data.players || []).forEach(p => {
          const solved = Object.values(data.solved_by).filter(n => n === p).length;
          const div = document.createElement('div');
          div.className = 'puzzle-item' + (p === data.host ? ' solved' : '');
          div.innerHTML = `<div class="dot ${p === data.host ? 'solved' : 'unsolved'}"></div>${p}${p === data.host ? ' (voditelj)' : ''} — riješio/la: <strong>${solved}</strong>`;
          playersList.appendChild(div);
        });

        const timerEl = document.getElementById('timer');
        const t = data.time_remaining;
        timerEl.textContent = formatTime(t);
        timerEl.className = 'timer' + (t < 120 ? ' danger' : t < 300 ? ' warning' : '');

        document.getElementById('completed-banner').style.display = data.game_completed ? 'block' : 'none';
        document.getElementById('status-bar').textContent = 'Ažurirano: ' + new Date().toLocaleTimeString();
      } catch (e) {
        document.getElementById('status-bar').textContent = 'Greška pri dohvatu podataka — ' + new Date().toLocaleTimeString();
      }
    }

    function deleteLobby() {
      if (!currentLobby) return;
      if (!confirm('Jesi li siguran da želiš obrisati lobby "' + currentLobby + '"?')) return;
      fetch('/delete_lobby/' + currentLobby, { method: 'DELETE' })
        .then(r => r.json())
        .then(() => {
          stopRefresh();
          currentLobby = null;
          document.getElementById('main-section').style.display = 'none';
          document.getElementById('timer-section').style.display = 'none';
          document.getElementById('players-section').style.display = 'none';
          document.getElementById('completed-banner').style.display = 'none';
          document.getElementById('no-session').style.display = 'none';
          document.getElementById('lobby-select-section').style.display = 'block';
          document.getElementById('status-bar').textContent = 'Lobby obrisan.';
          loadLobbyList();
        })
        .catch(() => alert('Greška pri brisanju lobbyja'));
    }

    let refreshInterval = null;

    function stopRefresh() {
      if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
    }

    function startRefresh() {
      stopRefresh();
      refresh();
      refreshInterval = setInterval(refresh, 3000);
    }

    if (currentLobby) {
      document.getElementById('lobby-label').textContent = currentLobby;
      startRefresh();
    } else {
      document.getElementById('lobby-select-section').style.display = 'block';
      loadLobbyList();
    }
  </script>
</body>
</html>
